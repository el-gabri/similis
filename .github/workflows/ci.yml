name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Casa com o cluster documentado (Spark 15.4 LTS, Python 3.10).
          python-version: "3.10"

      - name: Install tooling + deps do caminho Spark-free
        # A suíte roda sem Spark, faiss ou torch (o ranker cai para numpy, o
        # embedder/data_loader importam as libs pesadas lazy). Instalamos só o
        # necessário para lint + testes — rápido. Deps de runtime completas em
        # requirements.txt.
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest numpy pandas pyyaml unidecode

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        # Não falha o CI ainda: a formatação ampla é item futuro (plan.md). Roda
        # em modo informativo para dar visibilidade ao drift.
        run: ruff format --check . || true

      - name: Pytest
        run: pytest tests/
